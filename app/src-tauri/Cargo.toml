[package]
name = "memu"
version = "0.1.0"
edition = "2021"
description = "Memu proactive assistant desktop shell"

[lib]
name = "memu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# 进程健康探测（轻量，避免引入 reqwest 全家桶）
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
